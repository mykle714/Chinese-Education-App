<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- maximum-scale=1 + user-scalable=no disable double-tap / pinch zoom on
         Android/Chrome/Firefox. iOS Safari IGNORES user-scalable=no, so page-level
         pinch on iOS is blocked separately in JS via the useBlockZoom hook.

         viewport-fit=cover asks for the web view to paint EDGE TO EDGE — under the
         status bar and the home indicator — instead of being letterboxed inside the
         safe area. It is NECESSARY but NOT SUFFICIENT on iOS: in a home-screen web
         app it does nothing unless `apple-mobile-web-app-status-bar-style` is
         `black-translucent` (see the next comment). The other half of the trade —
         keeping content out from under those two strips — is `SAFE_TOP` /
         `SAFE_BOTTOM` in src/theme/safeArea.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Home-screen ("Add to Home Screen") behaviour. `capable` asks iOS for the
         standalone window with no Safari chrome.

         `status-bar-style` MUST be `black-translucent` for the app to paint the band
         behind the clock. This is the ONE tag that decides it, and the reason the
         2026-09 attempt failed: with `default` (or `black`) iOS keeps the web view
         LETTERBOXED below an opaque, OS-painted status bar no matter what
         `viewport-fit` says, `env(safe-area-inset-top)` resolves to 0px, and the band
         is filled by iOS from the document background it captured at LAUNCH. No
         runtime write — `theme-color`, `documentElement.style` — can reach it.
         `black-translucent` is what makes the web view actually extend under the bar,
         which is what turns SAFE_TOP (src/theme/safeArea.ts) non-zero and hands the
         band's colour to whatever surface is on screen.

         The trade: with `black-translucent` the app no longer chooses the GLYPH
         colour. On iOS 13+ the clock/battery follow the SYSTEM appearance (dark
         glyphs in light mode, light glyphs in dark mode), so a device in dark mode
         will show light glyphs over the app's paper-white pages. If that turns out to
         be unreadable in practice, the fix is a dark top band on light pages, not a
         return to `default` — `default` cannot colour the band at all.

         ⚠️ iOS SNAPSHOTS THESE TAGS WHEN THE ICON IS ADDED. Changing them does not
         affect an already-installed icon: delete it from the Home Screen and re-add
         it, or the old behaviour persists no matter what ships. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The colour Android Chrome (toolbar) and iOS SAFARI-TAB browsing paint behind
         the status bar. This is only the DEFAULT — the app's paper ground; screens
         that flood the page with their own ground (every game, via
         GameSurfaceProvider) rewrite this tag while mounted through the
         useThemeColor hook. It does NOT reach the iOS home-screen web app's status
         bar — that band is page pixels now, painted by whatever surface is on screen
         thanks to viewport-fit=cover + black-translucent above. Value mirrors
         COLORS.background. -->
    <meta name="theme-color" content="#FBFAF8" />
    <title>Cow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Shelf redesign (docs/SHELF_REDESIGN.md, D1/D3). These back the FONTS.* stacks
         in src/theme/fonts.ts:
           Instrument Sans  - primary Latin UI
           Instrument Serif - Latin display / hero (CJK falls through to Noto Serif SC)
           Azeret Mono      - DATA: counts, scores, user ids, timers, numbered-tone
                              pinyin. Replaced JetBrains Mono on 2026-09-04.
           Public Sans      - INFO TYPE: the overline/caption voice (FONTS.label). Split
                              off the mono token on 2026-09-04 because that one token was
                              setting both prose and data; see docs/INFO_TYPE_LAB.md.
           Noto Sans/Serif SC - CJK glyphs + hero character
         `display=swap` on all of them: text must stay readable while faces load. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Azeret+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Material Symbols Rounded — the icon face (D3), replacing per-icon
         @mui/icons-material imports. Separate <link> because it is a variable font on
         four axes (optical size, weight, fill, grade) that the other families do not
         share. `display=block` NOT `swap`: this face renders LIGATURES, so a swap
         period would show the literal word "nights_stay" before the glyph arrives.
         block hides the text for ~3s instead. See the `.ms` rule in src/index.css. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
